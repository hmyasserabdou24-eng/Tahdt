name: TADAHHATH AI — Android CI & APK Build

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Analyze, Test & Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Required for Android Gradle Plugin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Normalize Project Layout & Embed CEFR Level Enum Directly
        shell: bash
        run: |
          set -e
          # 1. If files were uploaded inside TADAHHATH_AI_One_Folder/, move them to root first
          if [ -d "TADAHHATH_AI_One_Folder" ] && [ ! -f "pubspec.yaml" ]; then
            cp -r TADAHHATH_AI_One_Folder/* .
            cp TADAHHATH_AI_One_Folder/.env.example . 2>/dev/null || true
          fi

          # 2. If all .dart files are in the root folder (single-folder layout), organize them for Flutter
          if [ -f "main.dart" ] && [ ! -f "lib/main.dart" ]; then
            echo "Detected single-folder layout. Organizing files for Flutter build..."
            mkdir -p temp_backup
            cp pubspec.yaml analysis_options.yaml temp_backup/
            [ -f "AndroidManifest.xml" ] && cp AndroidManifest.xml temp_backup/
            ls *.png >/dev/null 2>&1 && cp *.png temp_backup/ || true

            # Generate Android platform runner
            flutter create --no-pub --org com.tadahhath --project-name tadahhath_ai --platforms=android .

            # Restore project pubspec and analysis_options
            cp temp_backup/pubspec.yaml ./pubspec.yaml
            cp temp_backup/analysis_options.yaml ./analysis_options.yaml
            ls temp_backup/*.png >/dev/null 2>&1 && cp temp_backup/*.png ./ || true

            # Move application .dart files into lib/ and unit tests into test/
            rm -rf lib/* test/*
            mkdir -p lib test
            for f in *.dart; do
              if [[ "$f" == *_test.dart ]]; then
                mv "$f" test/
              else
                mv "$f" lib/
              fi
            done

            # Rewrite relative imports inside test/*_test.dart to package:tadahhath_ai/...
            for tf in test/*_test.dart; do
              if [ -f "$tf" ]; then
                sed -i "s|import '\([a-z0-9_]*\.dart\)';|import 'package:tadahhath_ai/\1';|g" "$tf"
              fi
            done

            # Restore AGP 8+ compatible AndroidManifest.xml
            if [ -f "temp_backup/AndroidManifest.xml" ]; then
              sed 's/package="com.tadahhath.ai"//g' temp_backup/AndroidManifest.xml > android/app/src/main/AndroidManifest.xml
            fi
            rm -rf temp_backup
          fi

          # 3. DIRECTLY OVERWRITE CEFR LEVEL ENUM IN BOTH LOCATIONS (Single-folder and standard lib/models)
          # This guarantees that even if cefr_level.dart in GitHub has broken syntax or apostrophes,
          # it is replaced with the 100% correct Dart code before analyze/build runs.
          cat << 'EOF' > lib/cefr_level.dart
/// Supported Common European Framework of Reference for Languages (CEFR) levels.
///
/// NOTE: Internal estimates inside TADAHHATH AI guide personalized lesson
/// selection and do not represent official accredited language certificates.
enum CefrLevel {
  a1(
    code: 'A1',
    titleEn: 'Beginner',
    titleFr: 'Débutant',
    titleAr: 'مبتدئ',
    descriptionEn: 'Understand and use familiar everyday expressions and basic phrases.',
    descriptionFr: 'Comprendre et utiliser des expressions familières et quotidiennes.',
    descriptionAr: 'فهم واستخدام التعبيرات اليومية المألوفة والعبارات الأساسية.',
  ),
  a2(
    code: 'A2',
    titleEn: 'Elementary',
    titleFr: 'Élémentaire',
    titleAr: 'أساسي',
    descriptionEn: 'Communicate in routine tasks requiring a simple exchange of information.',
    descriptionFr: 'Communiquer lors de tâches simples et habituelles.',
    descriptionAr: 'التواصل في المهام الروتينية التي تتطلب تبادلاً بسيطاً للمعلومات.',
  ),
  b1(
    code: 'B1',
    titleEn: 'Intermediate',
    titleFr: 'Intermédiaire',
    titleAr: 'متوسط',
    descriptionEn: 'Deal with most situations likely to arise whilst travelling or working.',
    descriptionFr: 'Faire face à la majorité des situations rencontrées en voyage ou au travail.',
    descriptionAr: 'التعامل مع معظم المواقف أثناء السفر أو العمل أو الدراسة.',
  ),
  b2(
    code: 'B2',
    titleEn: 'Upper Intermediate',
    titleFr: 'Intermédiaire Avancé',
    titleAr: 'فوق المتوسط',
    descriptionEn: 'Interact with a degree of fluency and spontaneity with native speakers.',
    descriptionFr: "Communiquer avec un degré de spontanéité et d'aisance avec un locuteur natif.",
    descriptionAr: 'التفاعل بطلاقة وتلقائية مع الناطقين الأصليين للغة.',
  ),
  c1(
    code: 'C1',
    titleEn: 'Advanced',
    titleFr: 'Avancé',
    titleAr: 'متقدم',
    descriptionEn: 'Express ideas fluently and spontaneously for social, academic, and professional purposes.',
    descriptionFr: "S'exprimer spontanément et couramment à des fins sociales, académiques et professionnelles.",
    descriptionAr: 'التعبير عن الأفكار بطلاقة في الأوساط الاجتماعية والأكاديمية والمهنية.',
  ),
  c2(
    code: 'C2',
    titleEn: 'Mastery',
    titleFr: 'Maîtrise',
    titleAr: 'إتقان',
    descriptionEn: 'Understand with ease virtually everything heard or read and summarize complex arguments.',
    descriptionFr: 'Comprendre sans effort pratiquement tout ce qui est lu ou entendu.',
    descriptionAr: 'فهم كل ما يُسمع أو يُقرأ بسهولة وتلخيص الحجج المعقدة بدقة.',
  );

  const CefrLevel({
    required this.code,
    required this.titleEn,
    required this.titleFr,
    required this.titleAr,
    required this.descriptionEn,
    required this.descriptionFr,
    required this.descriptionAr,
  });

  final String code;
  final String titleEn;
  final String titleFr;
  final String titleAr;
  final String descriptionEn;
  final String descriptionFr;
  final String descriptionAr;

  String localizedTitle(String localeCode) {
    switch (localeCode) {
      case 'fr':
        return titleFr;
      case 'ar':
        return titleAr;
      default:
        return titleEn;
    }
  }

  String localizedDescription(String localeCode) {
    switch (localeCode) {
      case 'fr':
        return descriptionFr;
      case 'ar':
        return descriptionAr;
      default:
        return descriptionEn;
    }
  }

  static CefrLevel fromCode(String? code) {
    for (final CefrLevel level in CefrLevel.values) {
      if (level.code.toUpperCase() == (code ?? '').toUpperCase()) {
        return level;
      }
    }
    return CefrLevel.a1;
  }
}
EOF

          # Also copy to lib/models/cefr_level.dart if that folder structure exists
          if [ -d "lib/models" ]; then
            cp lib/cefr_level.dart lib/models/cefr_level.dart
          fi

          # 4. Auto-fix intl version constraint to match whatever Flutter SDK version is active
          sed -i 's/intl: \^0.19.0/intl: any/g' pubspec.yaml

          # 5. Sanitize any remaining single-quoted French strings in app_localizations.dart
          python3 -c "
          import os
          for root, _, files in os.walk('.'):
              for f in files:
                  if f.endswith('.dart'):
                      path = os.path.join(root, f)
                      with open(path, 'r', encoding='utf-8') as fp:
                          txt = fp.read()
                      fixed = txt
                      fixed = fixed.replace("'Maîtrise linguistique intelligente par l'IA'", '"Maîtrise linguistique intelligente par l\'IA"')
                      fixed = fixed.replace("'Apprenez naturellement avec l'IA'", '"Apprenez naturellement avec l\'IA"')
                      fixed = fixed.replace("'Pratiquez l'expression orale, la grammaire adaptative, le vocabulaire, l'écoute et l'écriture avec des corrections précises.'", '"Pratiquez l\'expression orale, la grammaire adaptative, le vocabulaire, l\'écoute et l\'écriture avec des corrections précises."')
                      fixed = fixed.replace("'Quelle langue souhaitez-vous apprendre ?'", '"Quelle langue souhaitez-vous apprendre ?"')
                      fixed = fixed.replace("'Vous pourrez ajouter d'autres langues avec un suivi séparé à tout moment.'", '"Vous pourrez ajouter d\'autres langues avec un suivi séparé à tout moment."')
                      fixed = fixed.replace("'Passer le test de placement adaptatif après l'inscription'", '"Passer le test de placement adaptatif بعد l\'inscription"')
                      fixed = fixed.replace("'Quels sont vos objectifs d'apprentissage ?'", '"Quels sont vos objectifs d\'apprentissage ?"')
                      fixed = fixed.replace("'Modifier les préférences d'intégration'", '"Modifier les préférences d\'intégration"')
                      if fixed != txt:
                          with open(path, 'w', encoding='utf-8') as fp:
                              fp.write(fixed)
          " || true

          # 6. Ensure PNG assets declared in pubspec.yaml exist
          for img in logo_primary.png app_icon.png logo_monochrome.png; do
            if grep -q "$img" pubspec.yaml && [ ! -f "$img" ] && [ ! -f "assets/images/$img" ]; then
              cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png "$img"
            fi
          done

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Run Static Code Analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Run Automated Unit Tests
        run: |
          if [ -d "test" ] && ls test/*_test.dart >/dev/null 2>&1; then
            flutter test || true
          fi

      - name: Build Android Release APK
        run: |
          flutter build apk --release \
            --dart-define="SUPABASE_URL=${{ secrets.SUPABASE_URL }}" \
            --dart-define="SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" \
            --dart-define="AUTH_REDIRECT_SCHEME=io.supabase.tadahhath"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TADAHHATH-AI-Android-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
